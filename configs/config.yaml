model:
  weights: "yolov8n.pt"
  confidence: 0.4
  device: "cpu"

tracker:
  type: "bytetrack"
  track_thresh: 0.5

classes:
  filter: ["person", "car"]

performance:
  frame_skip: 1
  resize_width: 640

counting:
  enabled: true
  line_start: [0, 300]
  line_end: [640, 300]

speed_estimation:
  enabled: true
  pixels_per_meter: 20
  fps_override: 0

cropping:
  enabled: false
  save_dir: "outputs/crops"

tensorboard:
  enabled: true
  log_dir: "outputs/tensorboard_logs"

video:
  input_path: "data/raw/traffic_1.mp4"
  output_path: "outputs/videos/tracked_output.mp4"
  show_live: false

logging:
  log_path: "outputs/logs/tracks.csv"
