model:
  weights: "yolov8s.pt"      # upgraded from n -> s for better accuracy (still CPU-friendly)
  confidence: 0.35            # slightly lower threshold = catches more true positives
  iou: 0.45                   # NMS IoU threshold
  device: "cpu"

tracker:
  type: "bytetrack"
  track_thresh: 0.5

classes:
  filter: []   # empty = keep all classes

performance:
  frame_skip: 1
  resize_width: 640

counting:
  enabled: true
  line_start: [320, 100]
  line_end: [320, 360]

speed_estimation:
  enabled: true
  pixels_per_meter: 20
  fps_override: 0

cropping:
  enabled: false
  save_dir: "outputs/crops"

cifar_classification:
  enabled: true
  model_name: "cifar100_resnet56"   # upgraded from resnet20 -> resnet56 for better accuracy

tensorboard:
  enabled: true
  log_dir: "outputs/tensorboard_logs"

video:
  input_path: "data/raw/traffic_1.mp4"
  output_path: "outputs/videos/tracked_output.mp4"
  show_live: false

logging:
  log_path: "outputs/logs/tracks.csv"
