model:
  weights: "yolov8n-oiv7.pt"   # Open Images V7 — 600+ classes (includes Deer, Tiger, Fox, etc.)
  confidence: 0.4
  device: "cpu"

tracker:
  type: "bytetrack"
  track_thresh: 0.5

classes:
  filter: []   # OIV7 class names differ from COCO (e.g. "Person", "Car", "Deer") — leave empty to keep all, or check model.names after first run

performance:
  frame_skip: 1
  resize_width: 640

counting:
  enabled: true
  line_start: [320, 100]
  line_end: [320, 360]

speed_estimation:
  enabled: true
  pixels_per_meter: 20
  fps_override: 0

cropping:
  enabled: false
  save_dir: "outputs/crops"

cifar_classification:
  enabled: true
  model_name: "cifar100_resnet20"   # or cifar10_resnet20, cifar100_resnet32/44/56

tensorboard:
  enabled: true
  log_dir: "outputs/tensorboard_logs"

video:
  input_path: "data/raw/animal_3.mp4"
  output_path: "outputs/videos/tracked_output.mp4"
  show_live: false

logging:
  log_path: "outputs/logs/tracks.csv"
